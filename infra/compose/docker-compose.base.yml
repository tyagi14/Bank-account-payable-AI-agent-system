# Shared foundations every other layer includes.
name: custodian

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      CUSTODIAN_DB_PASSWORD: ${CUSTODIAN_DB_PASSWORD:?}
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:?}
      AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD:?}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      INFISICAL_DB_PASSWORD: ${INFISICAL_DB_PASSWORD:?}
      LITELLM_DB_PASSWORD: ${LITELLM_DB_PASSWORD:?}
      MLFLOW_DB_PASSWORD: ${MLFLOW_DB_PASSWORD:?}
      LANGFUSE_DB_PASSWORD: ${LANGFUSE_DB_PASSWORD:?}
      OPENMETADATA_DB_PASSWORD: ${OPENMETADATA_DB_PASSWORD:?}
      TZ: UTC
      PGTZ: UTC
    command: ["postgres", "-c", "max_connections=400", "-c", "shared_buffers=256MB"]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ../postgres-init:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:15432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits: { memory: 768m }

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    logging: *logging
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    volumes: [minio-data:/data]
    ports: ["127.0.0.1:19000:9000", "127.0.0.1:19001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits: { memory: 384m }

  minio-init:
    build: ../minio-init
    image: custodian/minio-init:local
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-1}
      AUDIT_MINIO_PASSWORD: ${AUDIT_MINIO_PASSWORD:?}
      LANGFUSE_MINIO_PASSWORD: ${LANGFUSE_MINIO_PASSWORD:?}
    depends_on:
      minio: { condition: service_healthy }

  redis:
    image: redis:8.10.2-alpine
    restart: unless-stopped
    logging: *logging
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--maxmemory-policy", "noeviction"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    deploy:
      resources:
        limits: { memory: 192m }

volumes:
  postgres-data:
  minio-data:
  redis-data:
