# Identity governance: humans (Keycloak), workloads (SPIRE), secrets (Infisical).
name: custodian
include:
  - docker-compose.base.yml

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    restart: unless-stopped
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      KC_HOSTNAME: http://localhost:18081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      JAVA_OPTS_KC_HEAP: "-XX:MaxRAMPercentage=65"
    volumes:
      - ../keycloak/import:/opt/keycloak/data/import:ro
    ports: ["127.0.0.1:18081:8080"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    deploy:
      resources:
        limits: { memory: 768m }

  # The SPIRE server image runs as uid 1000 and has no shell; hand it ownership of its fresh data volume.
  spire-server-volume-init:
    image: busybox:1.38.0
    restart: "no"
    command: ["chown", "-R", "1000:1000", "/opt/spire/data"]
    volumes: [spire-server-data:/opt/spire/data]

  spire-server:
    image: ghcr.io/spiffe/spire-server:1.15.5
    restart: unless-stopped
    command: ["-config", "/opt/spire/conf/server/server.conf"]
    volumes:
      - ../spire/server.conf:/opt/spire/conf/server/server.conf:ro
      - spire-server-data:/opt/spire/data
    depends_on:
      spire-server-volume-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-server", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits: { memory: 192m }

  spire-agent:
    image: ghcr.io/spiffe/spire-agent:1.15.5
    restart: unless-stopped
    # The docker workload attestor maps a caller's PID to its container, so it needs the host PID namespace.
    pid: host
    command: ["-config", "/opt/spire/conf/agent/agent.conf", "-joinToken", "${SPIRE_JOIN_TOKEN:-unset}"]
    volumes:
      - ../spire/agent.conf:/opt/spire/conf/agent/agent.conf:ro
      - ../spire/bootstrap:/opt/spire/bootstrap:ro
      - spire-agent-data:/opt/spire/data/agent
      - spire-sockets:/run/spire/sockets
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      spire-server: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-agent", "healthcheck", "-socketPath", "/run/spire/sockets/agent.sock"]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits: { memory: 192m }

  infisical:
    image: infisical/infisical:v0.167.2
    restart: unless-stopped
    environment:
      ENCRYPTION_KEY: ${INFISICAL_ENCRYPTION_KEY:?}
      AUTH_SECRET: ${INFISICAL_AUTH_SECRET:?}
      DB_CONNECTION_URI: postgres://infisical:${INFISICAL_DB_PASSWORD:?}@postgres:5432/infisical
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/1
      SITE_URL: http://localhost:18082
      TELEMETRY_ENABLED: "false"
      NODE_ENV: production
    ports: ["127.0.0.1:18082:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/status"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    deploy:
      resources:
        limits: { memory: 1g }

  # One-shot: fetches an X.509 SVID through the test/verification SPIRE entry and prints its real expiry.
  spire-verify:
    build: ../../custodian-backend
    image: custodian/backend:local
    profiles: ["tools"]
    labels:
      custodian.workload: spire-verify
    entrypoint: ["python", "-m", "app.tools.svid_probe"]
    environment:
      SPIFFE_ENDPOINT_SOCKET: unix:///run/spire/sockets/agent.sock
    volumes:
      - spire-sockets:/run/spire/sockets:ro
    depends_on:
      spire-agent: { condition: service_healthy }

volumes:
  spire-server-data:
  spire-agent-data:
  spire-sockets:
